<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="cart0.css">
</head>
<body>
    <img src="CheckoutReturn.png" class="checkoutreturnpng" onclick="CheckoutReturn()">
    <img src="EisenShopText.png" class="eisenshoptextpng">
    <img src="treesbackground.png" class="treesbackground">

    <div class="checkoutLayout">

        <div class="deliveryForm">
            <form id="purchase">
                <h2>Contact</h2>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <label for="phone">Phone Number (optional):</label>
                <input type="text" id="phone" name="phone" value="+36/">
                <cite>Phone number style: +XX/XX-XXX-XXXX (pl.: +36/30-123-4567)</cite>
                <h2>Delivery</h2>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="John Smith" required>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" placeholder="123 Main St" required>
                <label for="postalcode">Postal Code:</label>
                <input type="text" id="postalcode" name="postalcode" placeholder="12345" required>
                <label for="city">City:</label>
                <input type="text" id="city" name="city" placeholder="Zalaegerszeg" required>
                <button type="submit" class="payNowButton">PAY NOW</button>
            </form>
        </div>

        <div class="cartListCost">
            <h2>Your Cart</h2>
            <div id="checkoutCartItems" class="checkoutCartItems">
                <p>Loading cart...</p>
            </div>
            <p id="checkoutCartTotal" class="checkoutCartTotal"></p>
        </div>
    </div>

    <img src="CheckoutReturn.png" class="checkoutreturnbottompng" onclick="CheckoutReturn()">


<script src="cart0code.js"></script>
</body>
</html>
