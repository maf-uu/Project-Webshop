<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <img src="EisenShopTextGray.png" class="eisenshoptextpng">
    <h1 class="register-title">Sign Up Registry</h1>

    <div class="background-curve one"></div>
    <div class="background-curve two"></div>

    <div class="form-box register-form">
    <form id="signup" action="/auth/register" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="username">
        <label for="password">Password:</label>
        <div class="passinput">
            <input type="password" id="password" name="password" placeholder="password">
            <img src="eye-close.png" id="eyeicon">
        </div>
        
        
        <cite>Password must contain:</cite>
        <cite><ul>
            <li>At least 8 characters</li>
            <li>At least one uppercase letter</li>
            <li>At least one lowercase letter</li>
            <li>At least one number</li>
        </ul></cite>
        <label for="confirmpassword">Confirm Password:</label>
        <input type="password" id="confirmpassword" name="confirmpassword" placeholder="password">
        <label for="email">E-mail:</label>
        <input type="text" id="email" name="email" placeholder="placeholder@gmail.com">
        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" name="phone" value="+36/">
        <cite>Phone number style: +XX/XX-XXX-XXXX (pl.: +36/30-123-4567) </cite>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="John Smith">
        <label for="gender"></label>
        <select id="gender" name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="nonaswer">I prefer not to answer</option>
        </select>


        <label for="terms">
            <input type="checkbox" id="terms" name="terms">
            I accept the terms and conditions
        </label>
        <button type="submit">REGISTER</button>

    </div>
    <div class="form-links">
    <p class="loginwithacc"><a href="login.html">I already have an Account</a></p>
    <p class="guest"><a href="website0.html">Continue as Guest</a></p>
</div>


<script src="registercode.js"></script>
</body>
</html>
