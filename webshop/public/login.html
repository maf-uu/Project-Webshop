<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eisenshop Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <img src="EisenShopTextGray.png" class="eisenshoptextpng">
    <h1 class="login-title">Log Into Account</h1>
    <div class="form-box login-form">
    <form id="login" action="/auth/login" method="post">
        
        <label for="loginemail">E-mail:</label>
        <input type="text" id="email" name="email" placeholder="placeholder@gmail.com">

        <label for="password">Password:</label>
        <div class="loginpassinput">
            <input type="password" id="password" name="password" placeholder="password">
            <img src="eye-close.png" id="logineyeicon">
        </div>

        <button type="submit">LOGIN</button>

    </form>
    </div>
    <div class="form-links">
    <p class="createaccount"><a href="register.html">Create an Account</a></p>
    <p class="guest"><a href="website0.html">Continue as Guest</a></p>
</div>
<script src="logincode.js"></script>
</body>

</html>
